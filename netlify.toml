[build]
  base = "frontend"
  command = "CI=false yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  REACT_APP_BACKEND_URL = "https://copolyz.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://copolyz.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
